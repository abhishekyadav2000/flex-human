name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flex
          POSTGRES_PASSWORD: flex
          POSTGRES_DB: flexhuman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flex -d flexhuman"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://flex:flex@localhost:5432/flexhuman
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
